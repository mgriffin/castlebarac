# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  activerecord:
    errors:
      models:
        person:
          attributes:
            base:
              linked_to_someone_else: "%{name} is already linked to another account"
              account_has_a_person: "%{email} is already linked to %{name}, who has results, teams or family on the site"
        person_relationship:
          attributes:
            child_id:
              taken: "is already linked to this parent"
            child:
              own_parent: "can't be the same person as the parent"
  admin:
    person_claims:
      approve:
        approved: "Linked %{email} to %{name}"
      reject:
        rejected: "Rejected %{email}'s claim to be %{name}"
    people:
      accounts:
        create:
          linked: "Linked %{email} to %{name}"
          no_account: "There's no account with that email address"
        destroy:
          unlinked: "Unlinked %{email} from %{name}"
      relationships:
        create:
          already_linked: "%{parent} is already linked as the parent of %{child}"
          linked: "Linked %{parent} as the parent of %{child}"
    teams:
      memberships:
        create:
          added: "Added %{name} to %{team}"
          already_a_member: "%{name} is already a member of %{team}"
          choose: "Choose someone from the list to add them to the team"
        destroy:
          removed: "Removed %{name} from %{team}"
          not_yourself: "You can't remove yourself from the Admins team"
    users:
      admin_memberships:
        create:
          added: "%{name} is now an admin"
          no_person: "%{email} isn't linked to a person yet, so they can't be added to the Admins team"
        destroy:
          removed: "%{name} is no longer an admin"
          not_yourself: "You can't remove yourself from the Admins team"
    result_imports:
      create:
        choose_a_race: "Choose at least one race to import"
        event_invalid: "Couldn't create the event: %{errors}"
        imported:
          one: "Imported 1 result into %{title}"
          other: "Imported %{count} results into %{title}"
        linked:
          zero: ""
          one: " and linked 1 Castlebar athlete to their profile"
          other: " and linked %{count} Castlebar athletes to their profiles"
    unlinked_results:
      create:
        linked:
          zero: "No one was added"
          one: "Added and linked 1 person"
          other: "Added and linked %{count} people"
  wrong_email_or_password: "Wrong email or password"
  profiles:
    thanks: "Thanks for updating your info"
    create:
      claimed: "Thanks. An admin will check that you're %{name}, and link them to your account"
    claims:
      destroy:
        cancelled: "Cancelled. You can fill out your details now"
  registrations:
    create:
      notice: "Signed up successfully"
  sessions:
    create:
      alert: "Username or password was incorrect"
  posts:
    comments:
      create:
        notice: "Your comment was successfully posted"
  time_trials:
    create:
      notice: "Created Time Trial"
    update:
      notice: "Updated Time Trial"
