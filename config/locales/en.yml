# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  admin:
    users:
      admin_memberships:
        create:
          added: "%{name} is now an admin"
          no_person: "%{email} isn't linked to a person yet, so they can't be added to the Admins team"
        destroy:
          removed: "%{name} is no longer an admin"
          not_yourself: "You can't remove yourself from the Admins team"
    result_imports:
      create:
        choose_a_race: "Choose at least one race to import"
        event_invalid: "Couldn't create the event: %{errors}"
        imported:
          one: "Imported 1 result into %{title}"
          other: "Imported %{count} results into %{title}"
        linked:
          zero: ""
          one: " and linked 1 Castlebar athlete to their profile"
          other: " and linked %{count} Castlebar athletes to their profiles"
    unlinked_results:
      create:
        linked:
          zero: "No one was added"
          one: "Added and linked 1 person"
          other: "Added and linked %{count} people"
  mailing_lists:
    create:
      notice: "You've been added"
      error: "Couldn't add your email address"
  mailing_list_mailer:
    welcome:
      subject: "Thanks for signing up to the mailing list"
  wrong_email_or_password: "Wrong email or password"
  profiles:
    thanks: "Thanks for updating your info"
  registrations:
    create:
      notice: "Signed up successfully"
  sessions:
    create:
      alert: "Username or password was incorrect"
  posts:
    comments:
      create:
        notice: "Your comment was successfully posted"
  person_relationships:
    create:
      already_done: "already linked"
      good: "Linked"
  time_trials:
    create:
      notice: "Created Time Trial"
    update:
      notice: "Updated Time Trial"
